services:
  postgres:
    image: postgres:17-alpine
    container_name: hermex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermex
      POSTGRES_USER: hermex
      POSTGRES_PASSWORD: hermex
    ports:
      - "5432:5432"
    volumes:
      - hermex-postgres-data:/var/lib/postgresql/data

volumes:
  hermex-postgres-data:

